{% load static finance_nav %}
{% finance_nav as nav_items %}

<header class="fixed inset-x-0 top-0 z-40 border-b border-border bg-background/95 backdrop-blur">
  <div class="mx-auto flex h-16 max-w-5xl items-center justify-between gap-4 px-4 md:h-20 md:px-8">

    <a href="{% url 'finance:home' %}" class="flex shrink-0 items-center gap-2">
      <img src="{% static 'img/datamays-logo-transparent.png' %}" alt="" class="h-7 w-7" />
      <span class="text-base font-bold tracking-tight md:text-lg">Household Finance</span>
    </a>

    <nav class="hidden items-center gap-6 text-sm text-text-secondary md:flex">
      {% for item in nav_items %}
        <a href="{{ item.href }}"
           class="transition hover:text-text-primary {% if item.is_active %}font-semibold text-text-primary{% endif %}"
           {% if item.is_active %}aria-current="page"{% endif %}>
          {{ item.label }}
        </a>
      {% endfor %}
    </nav>

    <div x-data="{ open: false }" class="relative shrink-0">
      <button type="button"
              @click="open = !open"
              :aria-expanded="open"
              aria-haspopup="menu"
              class="flex h-9 w-9 items-center justify-center rounded-full border border-border bg-surface text-sm font-semibold uppercase transition hover:bg-muted">
        <span class="sr-only">Open account menu</span>
        {{ request.user.get_short_name|default:request.user.username|slice:":1" }}
      </button>

      <div x-show="open"
           x-cloak
           @click.outside="open = false"
           @keydown.escape.window="open = false"
           role="menu"
           class="absolute right-0 mt-2 w-52 overflow-hidden rounded-card border border-border bg-surface py-1 shadow-xl">
        <a href="{% url 'finance:settings' %}" role="menuitem"
           class="block px-4 py-2.5 text-sm text-text-secondary transition hover:bg-muted hover:text-text-primary">Settings</a>
        <a href="{% url 'finance:preferences' %}" role="menuitem"
           class="block px-4 py-2.5 text-sm text-text-secondary transition hover:bg-muted hover:text-text-primary">Preferences</a>
        <a href="{% url 'core:home' %}" role="menuitem"
           class="block border-t border-border px-4 py-2.5 text-sm text-text-muted transition hover:bg-muted hover:text-text-primary">Back to datamays.com</a>

        <form method="post" action="{% url 'finance:logout' %}" class="border-t border-border">
          {% csrf_token %}
          <button type="submit" role="menuitem"
                  class="block w-full px-4 py-2.5 text-left text-sm text-text-secondary transition hover:bg-muted hover:text-text-primary">
            Sign out
          </button>
        </form>
      </div>
    </div>

  </div>
</header>
