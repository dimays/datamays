{% load finance_extras %}
<section class="rounded-card border border-border bg-surface p-5">
  <h2 class="text-sm font-semibold uppercase tracking-wide text-text-muted">{{ label }}</h2>

  <p class="mt-2 font-mono text-3xl font-bold {% if data.total < 0 %}text-warning{% endif %}">
    {% if data.total < 0 %}-{% endif %}${{ data.total|abs_money }}
  </p>

  <div class="mt-4 grid grid-cols-2 gap-3 text-sm">
    <div>
      <p class="text-xs uppercase tracking-wide text-text-muted">Assets</p>
      <p class="mt-0.5 font-mono text-success">${{ data.assets|money }}</p>
    </div>
    <div>
      <p class="text-xs uppercase tracking-wide text-text-muted">Debts</p>
      <p class="mt-0.5 font-mono text-warning">${{ data.liabilities|abs_money }}</p>
    </div>
  </div>
</section>
