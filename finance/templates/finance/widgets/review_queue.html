{% load finance_extras %}
{% if data.count %}
  <section class="rounded-card border border-warning/40 bg-warning/5 p-5">
    <div class="flex items-baseline justify-between gap-3">
      <h2 class="text-sm font-semibold uppercase tracking-wide text-warning">{{ label }}</h2>
      <a href="{% url 'finance:transactions' %}?review=1" class="text-xs text-primary hover:underline">
        Review {{ data.count }}
      </a>
    </div>

    <ul class="mt-3 space-y-1.5">
      {% for txn in data.transactions %}
        <li class="truncate text-sm text-text-secondary">
          {{ txn.description_raw }}
          <span class="text-text-muted">· ${{ txn.display_amount|money }}</span>
        </li>
      {% endfor %}
    </ul>
  </section>
{% endif %}
