{% comment %}
Card artwork for The Register: a page of the ledger on a leather desk, drawn in
the game's own palette. Most names are struck through in the colored pens the
game gives each clue; one is left standing, circled in red.
{% endcomment %}
<svg viewBox="0 0 260 150" class="w-full block" role="img"
     aria-label="A page of names, all struck through in colored pen but one, which is circled">
  <defs>
    <radialGradient id="reg-thumb-desk" cx="30%" cy="20%" r="100%">
      <stop offset="0" stop-color="#5a2018"/>
      <stop offset=".6" stop-color="#2c1410"/>
      <stop offset="1" stop-color="#17120e"/>
    </radialGradient>
    <linearGradient id="reg-thumb-paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffaf0"/>
      <stop offset="1" stop-color="#efe3c8"/>
    </linearGradient>
  </defs>

  <rect width="260" height="150" fill="url(#reg-thumb-desk)"/>
  <rect x="8" y="8" width="244" height="134" rx="10" fill="none" stroke="#e8c983" stroke-opacity=".25"/>

  <g transform="rotate(-4 130 78)">
    <rect x="66" y="16" width="128" height="122" rx="3" fill="#000" opacity=".35" transform="translate(3 4)"/>
    <rect x="66" y="16" width="128" height="122" rx="3" fill="url(#reg-thumb-paper)"/>
    <text x="130" y="29" text-anchor="middle" font-family="Georgia, serif" font-size="6.5"
          letter-spacing="1.2" fill="#8a7a5c">CHAPTER ONE</text>
    <rect x="80" y="33" width="100" height=".8" fill="#c9b892"/>

    <g font-family="Georgia, serif" font-size="7.4" fill="#4a3a28">
      <text x="80" y="46">Ada Whitcombe</text>
      <text x="80" y="57">Tomas Lindqvist</text>
      <text x="80" y="68">Mabel Okafor</text>
      <text x="80" y="79">Eamon Pryce</text>
      <text x="80" y="90">Ruth Calloway</text>
      <text x="80" y="101">Ivo Marchetti</text>
      <text x="80" y="112">Nell Hargreave</text>
      <text x="80" y="123">Otto Brandt</text>
    </g>
    <text x="172" y="46" text-anchor="end" font-family="Georgia, serif" font-size="5.5" fill="#a8977a">1</text>
    <text x="172" y="123" text-anchor="end" font-family="Georgia, serif" font-size="5.5" fill="#a8977a">8</text>

    <!-- the clues' pens, striking the innocent -->
    <g stroke-width="2.4" stroke-linecap="round" opacity=".85">
      <line x1="78" y1="43.5" x2="136" y2="43.5" stroke="#d9a400"/>
      <line x1="78" y1="54.5" x2="141" y2="54.5" stroke="#d9a400"/>
      <line x1="78" y1="65.5" x2="133" y2="65.5" stroke="#3f7fbf"/>
      <line x1="78" y1="87.5" x2="134" y2="87.5" stroke="#d6457a"/>
      <line x1="78" y1="98.5" x2="132" y2="98.5" stroke="#3f7fbf"/>
      <line x1="78" y1="109.5" x2="140" y2="109.5" stroke="#4f9a5b"/>
      <line x1="78" y1="120.5" x2="122" y2="120.5" stroke="#d6457a"/>
    </g>

    <!-- the one name left standing -->
    <ellipse cx="101" cy="76.6" rx="28" ry="7.6" fill="none" stroke="#8e2a1e" stroke-width="1.8"
             transform="rotate(-3 101 76.6)"/>
  </g>

  <text x="22" y="134" font-family="Georgia, serif" font-size="9" fill="#e8c983" opacity=".75"
        font-style="italic">26,000 names</text>
  <text x="238" y="134" text-anchor="end" font-family="Georgia, serif" font-size="9" fill="#e8c983"
        opacity=".75" font-style="italic">one killer</text>
</svg>
