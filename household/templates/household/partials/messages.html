{% if messages %}
  <div class="mt-6 space-y-2">
    {% for message in messages %}
      <div role="status"
           class="rounded-button border px-4 py-3 text-sm
                  {% if message.tags == 'error' %}border-error/40 bg-error/10 text-error
                  {% elif message.tags == 'success' %}border-success/40 bg-success/10 text-success
                  {% else %}border-border bg-surface text-text-secondary{% endif %}">
        {{ message }}
      </div>
    {% endfor %}
  </div>
{% endif %}
